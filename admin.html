<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>午休舱管理后台</title>
<style>
  :root {
    --navy: #0F2340;
    --blue: #1A4D8F;
    --sky: #3B82C4;
    --mist: #EDF4FB;
    --teal: #0D7A6B;
    --teal-light: #E0F5F1;
    --amber: #B85C0A;
    --amber-light: #FDF0E6;
    --red: #A32D2D;
    --red-light: #FDEAEA;
    --sand: #F7F5F2;
    --white: #FFFFFF;
    --gray1: #1C1C1E;
    --gray2: #48484A;
    --gray3: #8E8E93;
    --gray4: #C7C7CC;
    --gray5: #F2F2F7;
    --border: #E5E5EA;
    --radius: 12px;
    --radius-sm: 8px;
    --sidebar-w: 220px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif; background: var(--sand); color: var(--gray1); }

  /* Login */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--navy); }
  .login-box { background: white; border-radius: 16px; padding: 40px 32px; width: 360px; }
  .login-logo { text-align: center; margin-bottom: 28px; }
  .login-logo h1 { font-size: 20px; font-weight: 700; color: var(--navy); margin-top: 8px; }
  .login-logo p { font-size: 13px; color: var(--gray3); margin-top: 4px; }
  .login-field { margin-bottom: 14px; }
  .login-field label { display: block; font-size: 13px; color: var(--gray3); margin-bottom: 6px; }
  .login-field input { width: 100%; border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 11px 14px; font-size: 15px; outline: none; transition: border-color 0.15s; }
  .login-field input:focus { border-color: var(--blue); }
  .login-btn { width: 100%; background: var(--blue); color: white; border: none; border-radius: var(--radius-sm); padding: 13px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  .login-btn:hover { background: var(--navy); }
  .login-err { color: var(--red); font-size: 13px; text-align: center; margin-top: 10px; min-height: 20px; }

  /* Layout */
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: var(--sidebar-w); background: var(--navy); flex-shrink: 0; position: fixed; top: 0; bottom: 0; left: 0; overflow-y: auto; z-index: 10; }
  .sidebar-logo { padding: 20px 16px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .sidebar-logo h2 { color: white; font-size: 15px; font-weight: 600; }
  .sidebar-logo p { color: rgba(255,255,255,0.4); font-size: 12px; margin-top: 2px; }
  .sidebar-nav { padding: 12px 8px; }
  .nav-section { font-size: 10px; color: rgba(255,255,255,0.3); padding: 12px 8px 6px; letter-spacing: 0.8px; text-transform: uppercase; }
  .nav-item { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: var(--radius-sm); color: rgba(255,255,255,0.65); font-size: 14px; cursor: pointer; transition: all 0.15s; margin-bottom: 2px; }
  .nav-item:hover { background: rgba(255,255,255,0.08); color: white; }
  .nav-item.active { background: var(--sky); color: white; font-weight: 500; }
  .nav-item .badge { background: var(--amber); color: white; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: auto; }
  .sidebar-footer { padding: 16px; border-top: 1px solid rgba(255,255,255,0.08); }
  .logout-btn { width: 100%; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); border: none; border-radius: var(--radius-sm); padding: 9px; font-size: 13px; cursor: pointer; }
  .logout-btn:hover { background: rgba(255,255,255,0.15); }

  /* Main */
  .main { margin-left: var(--sidebar-w); flex: 1; padding: 24px; min-height: 100vh; }
  .page-header { margin-bottom: 24px; }
  .page-title { font-size: 22px; font-weight: 700; color: var(--navy); }
  .page-sub { font-size: 13px; color: var(--gray3); margin-top: 4px; }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
  .stat-card { background: white; border-radius: var(--radius); padding: 18px; border: 1px solid var(--border); }
  .stat-label { font-size: 12px; color: var(--gray3); margin-bottom: 8px; }
  .stat-value { font-size: 28px; font-weight: 700; color: var(--navy); line-height: 1; }
  .stat-value.teal { color: var(--teal); }
  .stat-value.amber { color: var(--amber); }
  .stat-value.blue { color: var(--blue); }
  .stat-sub { font-size: 12px; color: var(--gray3); margin-top: 6px; }

  /* Card */
  .card { background: white; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 20px; overflow: hidden; }
  .card-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .card-head h3 { font-size: 15px; font-weight: 600; color: var(--navy); }
  .card-body { padding: 0; }

  /* Filters */
  .filters { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: var(--sand); }
  .filter-input { border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 7px 12px; font-size: 13px; background: white; outline: none; color: var(--gray1); }
  .filter-input:focus { border-color: var(--blue); }
  .filter-btn { background: var(--blue); color: white; border: none; border-radius: var(--radius-sm); padding: 7px 16px; font-size: 13px; font-weight: 500; cursor: pointer; }
  .filter-btn.secondary { background: var(--gray5); color: var(--gray2); }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { padding: 10px 16px; text-align: left; font-size: 11px; font-weight: 500; color: var(--gray3); text-transform: uppercase; letter-spacing: 0.3px; border-bottom: 1px solid var(--border); background: var(--sand); white-space: nowrap; }
  td { padding: 12px 16px; border-bottom: 1px solid var(--gray5); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--sand); }

  /* Status badges */
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 500; white-space: nowrap; }
  .badge.pending { background: var(--amber-light); color: var(--amber); }
  .badge.confirmed { background: var(--teal-light); color: var(--teal); }
  .badge.released { background: var(--gray5); color: var(--gray3); }
  .badge.free { background: var(--mist); color: var(--blue); }

  /* Action buttons */
  .btn { display: inline-flex; align-items: center; gap: 4px; border: none; border-radius: 6px; padding: 5px 12px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .btn-confirm { background: var(--teal-light); color: var(--teal); }
  .btn-confirm:hover { background: var(--teal); color: white; }
  .btn-release { background: var(--red-light); color: var(--red); }
  .btn-release:hover { background: var(--red); color: white; }
  .btn-view { background: var(--mist); color: var(--blue); }
  .btn-view:hover { background: var(--blue); color: white; }
  .btn-primary { background: var(--blue); color: white; padding: 8px 16px; font-size: 13px; border-radius: var(--radius-sm); }
  .btn-primary:hover { background: var(--navy); }
  .btn-danger { background: var(--red-light); color: var(--red); padding: 8px 16px; font-size: 13px; border-radius: var(--radius-sm); }
  .btn-danger:hover { background: var(--red); color: white; }

  /* Form row */
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 20px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-size: 13px; color: var(--gray3); font-weight: 500; }
  .form-group input, .form-group select { border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; font-size: 14px; outline: none; transition: border-color 0.15s; background: white; }
  .form-group input:focus, .form-group select:focus { border-color: var(--blue); }
  .form-actions { padding: 0 20px 20px; display: flex; gap: 10px; }

  /* Pod map */
  .pod-map { padding: 20px; }
  .pod-map-section { margin-bottom: 20px; }
  .pod-map-title { font-size: 13px; font-weight: 600; color: var(--gray2); margin-bottom: 10px; }
  .pod-map-grid { display: grid; gap: 6px; }
  .pod-map-grid.female { grid-template-columns: repeat(8, 1fr); }
  .pod-map-grid.male { grid-template-columns: repeat(8, 1fr); }
  .pod-map-cell { aspect-ratio: 1; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; cursor: pointer; transition: all 0.15s; border: 1.5px solid transparent; }
  .pod-map-cell.available { background: var(--teal-light); color: var(--teal); border-color: #9FE1CB; }
  .pod-map-cell.occupied { background: var(--mist); color: var(--blue); border-color: #B8D4ED; }
  .pod-map-cell.maintenance { background: var(--amber-light); color: var(--amber); border-color: #F0C99A; }
  .pod-map-cell.weekly-zone { border-style: dashed; }

  /* Notice */
  .notice { background: var(--amber-light); border-left: 3px solid var(--amber); padding: 10px 14px; font-size: 13px; color: var(--amber); line-height: 1.5; margin: 16px 20px 0; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: white; border-radius: var(--radius); padding: 24px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
  .modal h3 { font-size: 17px; font-weight: 600; margin-bottom: 16px; }
  .modal-img { width: 100%; border-radius: var(--radius-sm); border: 1px solid var(--border); }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions button { flex: 1; }

  /* Empty */
  .empty { text-align: center; padding: 40px 20px; color: var(--gray3); }
  .empty-icon { font-size: 32px; margin-bottom: 10px; }
  .empty-text { font-size: 14px; }

  /* Tab */
  .tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 20px; }
  .tab { padding: 12px 16px; font-size: 14px; color: var(--gray3); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
  .tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 500; }

  /* Chart area */
  .chart-wrap { padding: 20px; }
  .bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 120px; }
  .bar-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bar { width: 100%; background: var(--mist); border-radius: 4px 4px 0 0; transition: height 0.3s; min-height: 4px; cursor: pointer; }
  .bar:hover { background: var(--sky); }
  .bar-label { font-size: 10px; color: var(--gray3); white-space: nowrap; }
  .bar-val { font-size: 10px; color: var(--gray2); font-weight: 500; }

  /* Toggle */
  .toggle { position: relative; width: 44px; height: 24px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; inset: 0; background: var(--gray4); border-radius: 12px; cursor: pointer; transition: 0.2s; }
  .toggle-slider:before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: 0.2s; }
  .toggle input:checked + .toggle-slider { background: var(--teal); }
  .toggle input:checked + .toggle-slider:before { transform: translateX(20px); }

  .loading { text-align: center; padding: 40px; color: var(--gray3); font-size: 14px; }
  .tag { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 20px; background: var(--gray5); color: var(--gray2); }
  .tag.weekly { background: var(--mist); color: var(--blue); }
  .tag.daily { background: var(--teal-light); color: var(--teal); }
  .tag.female { background: #FDE8F5; color: #8B2565; }
  .tag.male { background: var(--mist); color: var(--blue); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-wrap">
  <div class="login-box">
    <div class="login-logo">
      <div style="font-size:32px">🌙</div>
      <h1>午休舱管理后台</h1>
      <p>仅限管理人员登录</p>
    </div>
    <div class="login-field">
      <label>用户名</label>
      <input type="text" id="loginUser" placeholder="admin" value="admin">
    </div>
    <div class="login-field">
      <label>密码</label>
      <input type="password" id="loginPass" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()">登录</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- ADMIN APP -->
<div id="adminApp" style="display:none">
  <div class="app">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-logo">
        <h2>🌙 午休舱</h2>
        <p>管理后台</p>
      </div>
      <div class="sidebar-nav">
        <div class="nav-section">概览</div>
        <div class="nav-item active" onclick="showPage('dashboard')" id="nav-dashboard">📊 数据概览</div>
        <div class="nav-section">预约管理</div>
        <div class="nav-item" onclick="showPage('pending')" id="nav-pending">⏳ 待确认 <span class="badge" id="pendingBadge">0</span></div>
        <div class="nav-item" onclick="showPage('bookings')" id="nav-bookings">📋 全部预约</div>
        <div class="nav-item" onclick="showPage('free-booking')" id="nav-free-booking">🎟️ 免费预订</div>
        <div class="nav-section">配置</div>
        <div class="nav-item" onclick="showPage('pods')" id="nav-pods">🛏️ 床位管理</div>
        <div class="nav-item" onclick="showPage('holidays')" id="nav-holidays">📅 节假日配置</div>
      </div>
      <div class="sidebar-footer">
        <button class="logout-btn" onclick="doLogout()">退出登录</button>
      </div>
    </div>

    <!-- Main -->
    <div class="main" id="mainContent"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" style="display:none" onclick="closeModal(event)">
  <div class="modal" id="modalBox"></div>
</div>

<script>
// ============ CONFIG ============
const SUPABASE_URL = 'https://fbnofibcfpdcrhuaqvgh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_jmaLdj9S1t06j-1F_dhl8Q_36cO36xc';
const ADMIN_PASSWORD = 'admin123'; // 改成你想要的密码

const DEPARTMENTS = ['战略事业部','产品技术部','市场营销部','销售运营部','客户成功部','人力资源部','财务管理部','法务合规部','品牌设计部','供应链部','数据智能部','运营中心','行政后勤部','内容创作部','商务拓展部'];
const TIME_SLOTS = ['12:30–13:00','13:00–13:30','13:30–14:00'];

let currentPage = 'dashboard';
let allBookings = [], allPods = [], allBlocked = [];

// ============ SUPABASE ============
async function sbFetch(path, opts = {}) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || 'return=representation',
      ...opts.headers
    },
    ...opts
  });
  if (!res.ok) { const e = await res.text(); throw new Error(e); }
  return res.json().catch(() => null);
}

async function loadAll() {
  [allBookings, allPods, allBlocked] = await Promise.all([
    sbFetch('bookings?select=*&order=created_at.desc').catch(()=>[]),
    sbFetch('pods?select=*&order=gender.asc,pod_number.asc').catch(()=>[]),
    sbFetch('blocked_dates?select=*&order=date.asc').catch(()=>[])
  ]);
  updatePendingBadge();
}

function updatePendingBadge() {
  const n = allBookings.filter(b => b.status === 'pending').length;
  const el = document.getElementById('pendingBadge');
  if (el) { el.textContent = n; el.style.display = n > 0 ? 'inline' : 'none'; }
}

// ============ LOGIN ============
function doLogin() {
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  if (user === 'admin' && pass === ADMIN_PASSWORD) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminApp').style.display = 'block';
    loadAll().then(() => showPage('dashboard'));
  } else {
    document.getElementById('loginErr').textContent = '用户名或密码错误';
  }
}

function doLogout() {
  document.getElementById('adminApp').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginPass').value = '';
}

// ============ NAV ============
function showPage(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const nav = document.getElementById('nav-' + page);
  if (nav) nav.classList.add('active');
  renderPage();
}

function renderPage() {
  const c = document.getElementById('mainContent');
  switch(currentPage) {
    case 'dashboard': c.innerHTML = renderDashboard(); break;
    case 'pending': c.innerHTML = renderPending(); break;
    case 'bookings': c.innerHTML = renderBookings(); bindBookingFilters(); break;
    case 'free-booking': c.innerHTML = renderFreeBooking(); break;
    case 'pods': c.innerHTML = renderPods(); break;
    case 'holidays': c.innerHTML = renderHolidays(); break;
  }
}

// ============ DASHBOARD ============
let chartOffset = 0; // 0=最近7天, -7=前7天, +7=后7天

function buildDays(offset) {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i - offset);
    const ds = d.toISOString().slice(0,10);
    const rev = allBookings.filter(b => b.booking_date === ds && b.status === 'confirmed' && !b.is_free).reduce((s,b)=>s+(b.payment_amount||0),0);
    const cnt = allBookings.filter(b => b.booking_date === ds && b.status === 'confirmed').length;
    days.push({ ds, rev, cnt, label: `${d.getMonth()+1}/${d.getDate()}` });
  }
  return days;
}

function renderDashboard() {
  const today = new Date().toISOString().slice(0,10);
  const todayB = allBookings.filter(b => b.booking_date === today);
  const confirmedToday = todayB.filter(b => b.status === 'confirmed');
  const revenue = allBookings.filter(b => b.status === 'confirmed' && !b.is_free).reduce((s,b) => s + (b.payment_amount||0), 0);
  const pending = allBookings.filter(b => b.status === 'pending').length;
  const totalPods = allPods.filter(p => p.is_active).length;

  const days = buildDays(chartOffset);
  const maxRev = Math.max(...days.map(d=>d.rev), 1);
  const maxCnt = Math.max(...days.map(d=>d.cnt), 1);
  const periodLabel = chartOffset === 0 ? '最近7天' : chartOffset > 0 ? `前${chartOffset+7}～${chartOffset+1}天` : `后${-chartOffset-6}～${-chartOffset}天`;
  const canNext = chartOffset > 0;

  const recentBookings = allBookings.slice(0, 8);

  return `
  <div class="page-header">
    <div class="page-title">数据概览</div>
    <div class="page-sub">今日 ${today}</div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">今日预约（已确认）</div>
      <div class="stat-value blue">${confirmedToday.length}</div>
      <div class="stat-sub">共 ${todayB.length} 条申请</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">待确认收款</div>
      <div class="stat-value amber">${pending}</div>
      <div class="stat-sub">需要处理</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">累计收款</div>
      <div class="stat-value teal">¥${revenue.toFixed(0)}</div>
      <div class="stat-sub">已确认订单</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">可用床位</div>
      <div class="stat-value">${totalPods}</div>
      <div class="stat-sub">女${allPods.filter(p=>p.gender==='female'&&p.is_active).length} + 男${allPods.filter(p=>p.gender==='male'&&p.is_active).length}</div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
    <div class="card">
      <div class="card-head">
        <h3>收款（元）</h3>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:12px;color:var(--gray3)">${periodLabel}</span>
          <button class="btn btn-view" onclick="shiftChart(7)" style="padding:3px 10px;font-size:12px">← 前7天</button>
          <button class="btn btn-view" onclick="shiftChart(-7)" style="padding:3px 10px;font-size:12px" ${!canNext?'disabled style="opacity:.4;cursor:not-allowed;padding:3px 10px;font-size:12px"':''}>后7天 →</button>
        </div>
      </div>
      <div class="chart-wrap">
        <div class="bar-chart">
          ${days.map(d=>`
            <div class="bar-item">
              <div class="bar-val" style="font-size:10px">¥${d.rev}</div>
              <div class="bar" style="height:${Math.max(d.rev/maxRev*100,4)}px" title="${d.ds}: ¥${d.rev}"></div>
              <div class="bar-label">${d.label}</div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-head">
        <h3>预约量</h3>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:12px;color:var(--gray3)">${periodLabel}</span>
          <button class="btn btn-view" onclick="shiftChart(7)" style="padding:3px 10px;font-size:12px">← 前7天</button>

function exportCSV() {
  let filtered = allBookings;
  if (bookingFilter.date) filtered = filtered.filter(b => b.booking_date === bookingFilter.date);
  if (bookingFilter.gender) filtered = filtered.filter(b => b.gender === bookingFilter.gender);
  if (bookingFilter.cardType) filtered = filtered.filter(b => b.card_type === bookingFilter.cardType);
  if (bookingFilter.status) filtered = filtered.filter(b => b.status === bookingFilter.status);
  if (bookingFilter.search) {
    const s = bookingFilter.search.toLowerCase();
    filtered = filtered.filter(b => b.name?.includes(s) || b.employee_id?.includes(s));
  }
  const header = '日期,姓名,工号,区域,床位,卡类型,金额,是否免费,状态,提交时间';
  const rows = filtered.map(b =>
    [b.booking_date, b.name, b.employee_id,
     b.gender==='female'?'女舱':'男舱',
     String(b.pod_number).padStart(2,'0'),
     b.card_type==='weekly'?'周卡':'日卡',
     b.payment_amount||0, b.is_free?'是':'否',
     b.status, b.created_at?.slice(0,16)].join(',')
  );
  const csv = [header,...rows].join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`睡眠舱预约_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);
}

function renderPods() {
  const femalePods = allPods.filter(p => p.gender === 'female');
  const malePods = allPods.filter(p => p.gender === 'male');

  const todayStr = new Date().toISOString().slice(0,10);
  const todayOccupied = new Set(
    allBookings.filter(b => b.booking_date === todayStr && b.status === 'confirmed').map(b => `${b.gender}-${b.pod_number}`)
  );

  function podCell(p) {
    const isMaint = !p.is_active;
    const isOcc = todayOccupied.has(`${p.gender}-${p.pod_number}`);
    const cls = isMaint ? 'maintenance' : isOcc ? 'occupied' : 'available';

    const label = isMaint ? '维修' : isOcc ? '使用中' : '可用';
    return `<div class="pod-map-cell ${cls}${weeklyClass}" onclick="toggleMaintenance('${p.id}',${p.is_active})" title="${p.gender==='female'?'女':'男'}舱 #${p.pod_number} - 点击切换维修状态">

  return `

async function viewScreenshot(id) {
  const b = allBookings.find(x => x.id === id);
  if (!b) return;
  // Show modal immediately with loading state
  document.getElementById('modalBox').innerHTML = `
    <h3>付款截图 — ${b.name}</h3>
    <p style="font-size:13px;color:var(--gray3);margin-bottom:12px">${b.booking_date} · ${b.gender==='female'?'女舱':'男舱'} ${String(b.pod_number).padStart(2,'0')} · <span class="tag ${b.card_type}">${b.card_type==='weekly'?'周卡':'日卡'}</span> · ¥${b.payment_amount}</p>
    <div id="screenshotContent" style="background:var(--gray5);border-radius:8px;padding:40px;text-align:center;color:var(--gray3)">加载中…</div>
    <div class="modal-actions" style="margin-top:16px">
      <button class="btn btn-confirm" style="flex:1;padding:10px" onclick="confirmBooking('${id}');closeModal()">✓ 确认收款</button>
      <button class="btn btn-release" style="flex:1;padding:10px" onclick="rejectBooking('${id}');closeModal()">✗ 拒绝</button>
    </div>`;
  document.getElementById('modalOverlay').style.display = 'flex';

  // Fetch full booking record including screenshot data
  try {
    const rows = await sbFetch(`bookings?id=eq.${id}&select=payment_screenshot`);
    const screenshot = rows?.[0]?.payment_screenshot;
    const el = document.getElementById('screenshotContent');
    if (!el) return;
    if (screenshot && screenshot !== '已上传' && screenshot.startsWith('data:')) {
      el.innerHTML = `<img src="${screenshot}" style="max-width:100%;border-radius:8px;display:block;">`;
    } else if (screenshot === '已上传') {
      el.innerHTML = `<div style="padding:20px;color:var(--gray3);font-size:13px">截图已标记上传，但图片数据未能存储（文件过大）。<br>请联系员工重新提交。</div>`;
    } else {
      el.innerHTML = `<div style="padding:20px;color:var(--gray3);font-size:13px">暂无截图</div>`;
    }
  } catch(e) {
    const el = document.getElementById('screenshotContent');
    if (el) el.innerHTML = `<div style="padding:20px;color:var(--gray3)">加载失败</div>`;
  }
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').style.display = 'none';
  }
}
</script>
</body>
</html>
